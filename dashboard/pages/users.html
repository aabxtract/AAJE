<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AAJE Admin — Traders</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <nav class="sidebar">
    <div class="logo">AAJE Admin</div>
    <a href="../index.html">📊 Overview</a>
    <a href="users.html" class="active">👥 Traders</a>
    <a href="transactions.html">💳 Transactions</a>
    <a href="escalations.html">🔒 Escalations</a>
    <a href="analytics.html">📈 Analytics</a>
  </nav>
  <main class="content">
    <h1>Traders</h1>
    <table>
      <thead>
        <tr><th>Name</th><th>WhatsApp</th><th>Score</th><th>Status</th><th>Joined</th></tr>
      </thead>
      <tbody id="traders-tbody">
        <tr><td colspan="5" style="color:#718096">Loading...</td></tr>
      </tbody>
    </table>
  </main>
  <script>
    const API_BASE = "http://localhost:8000";
    const headers = { "Authorization": `Bearer ${localStorage.getItem("aaje_admin_token")}` };
    fetch(`${API_BASE}/admin/users`, { headers })
      .then(r => r.json())
      .then(data => {
        const tbody = document.getElementById("traders-tbody");
        tbody.innerHTML = data.users.length
          ? data.users.map(u => `
              <tr>
                <td>${u.verified_name}</td>
                <td>${u.wa_number}</td>
                <td>${u.trader_score}</td>
                <td><span class="badge ${u.is_active ? 'success' : 'danger'}">${u.is_active ? 'Active' : 'Inactive'}</span></td>
                <td>${u.created_at?.slice(0,10)}</td>
              </tr>`).join("")
          : "<tr><td colspan='5' style='color:#718096'>No traders yet.</td></tr>";
      });
  </script>
</body>
</html>
