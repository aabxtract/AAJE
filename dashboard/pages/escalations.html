<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AAJE Admin — Escalations</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <nav class="sidebar">
    <div class="logo">AAJE Admin</div>
    <a href="../index.html">📊 Overview</a>
    <a href="users.html">👥 Traders</a>
    <a href="transactions.html">💳 Transactions</a>
    <a href="escalations.html" class="active">🔒 Escalations</a>
    <a href="analytics.html">📈 Analytics</a>
  </nav>
  <main class="content">
    <h1>Escalations</h1>
    <table>
      <thead>
        <tr><th>WhatsApp</th><th>Reason</th><th>Created</th><th>Status</th></tr>
      </thead>
      <tbody id="esc-tbody">
        <tr><td colspan="4" style="color:#718096">Loading...</td></tr>
      </tbody>
    </table>
  </main>
  <script>
    const API_BASE = "http://localhost:8000";
    const headers = { "Authorization": `Bearer ${localStorage.getItem("aaje_admin_token")}` };
    fetch(`${API_BASE}/admin/escalations`, { headers })
      .then(r => r.json())
      .then(data => {
        const tbody = document.getElementById("esc-tbody");
        tbody.innerHTML = data.escalations.length
          ? data.escalations.map(e => `
              <tr>
                <td>${e.wa_number}</td>
                <td>${e.reason}</td>
                <td>${e.created_at?.slice(0,10)}</td>
                <td><span class="badge ${e.resolved ? 'success' : 'danger'}">${e.resolved ? 'Resolved' : 'Open'}</span></td>
              </tr>`).join("")
          : "<tr><td colspan='4' style='color:#718096'>No open escalations. 🎉</td></tr>";
      });
  </script>
</body>
</html>
