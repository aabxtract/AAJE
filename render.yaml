services:
  - type: web
    name: aaje-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
